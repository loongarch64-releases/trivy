version: 2

project_name: trivy
builds:
  - id: build-linux
    main: ./cmd/trivy/
    binary: trivy
    ldflags:
      - -s -w
      - "-extldflags '-static'"
      - -X github.com/aquasecurity/trivy/pkg/version/app.ver={{.Version}}
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
    goarch:
      - loong64

release:
    extra_files:
      - glob: ./bom.json
    discussion_category_name: Development

nfpms:
  -
    formats:
      - deb
      - rpm
    vendor: "aquasecurity"
    homepage: "https://github.com/aquasecurity"
    maintainer: "Aqua Security <oss@aquasec.com>"
    description: "A Fast Vulnerability Scanner for Containers"
    license: "Apache-2.0"
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_Linux-loong64"
    contents:
     - src: contrib/*.tpl
       dst: /usr/local/share/trivy/templates

archives:
  - id: archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_Linux-loong64"
    files:
      - README.md
      - LICENSE
      - contrib/*.tpl

dockers_v2:
  - ids:
      - build-linux
    images:
      - docker.io/aquasec/trivy
      - ghcr.io/aquasecurity/trivy
      - public.ecr.aws/aquasecurity/trivy
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/loong64
    extra_files:
      - contrib/
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A Fast Vulnerability Scanner for Containers"
      org.opencontainers.image.vendor: "Aqua Security"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/aquasecurity/trivy"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.url: "https://www.aquasec.com/products/trivy/"
      org.opencontainers.image.documentation: "https://trivy.dev/v{{ .Version }}/"
    annotations:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A Fast Vulnerability Scanner for Containers"
      org.opencontainers.image.vendor: "Aqua Security"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/aquasecurity/trivy"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.url: "https://www.aquasec.com/products/trivy/"
      org.opencontainers.image.documentation: "https://trivy.dev/v{{ .Version }}/"

signs:
- cmd: cosign
  signature: "${artifact}.sigstore.json"
  args:
    - "sign-blob"
    - "--bundle=${signature}"
    - "${artifact}"
    - "--yes"
  artifacts: all
  output: true

docker_signs:
- cmd: cosign
  artifacts: manifests
  output: true
  args:
  - 'sign'
  - '${artifact}'
  - '--yes'
